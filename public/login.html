                <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;"><svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;"><rect width="52" height="52" rx="9" fill="rgba(255,255,255,0.18)"/><rect width="52" height="52" rx="9" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="1"/><rect x="19" y="5" width="14" height="22" rx="7" fill="white" opacity="0.95"/><line x1="22" y1="11" x2="30" y2="11" stroke="rgba(180,70,0,0.18)" stroke-width="1.5"/><line x1="21" y1="16" x2="31" y2="16" stroke="rgba(180,70,0,0.18)" stroke-width="1.5"/><line x1="21" y1="21" x2="31" y2="21" stroke="rgba(180,70,0,0.12)" stroke-width="1.5"/><path d="M 10,22 Q 10,35 26,35 Q 42,35 42,22" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="26" y1="35" x2="26" y2="43" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="17" y1="43" x2="35" y2="43" stroke="white" stroke-width="2.5" stroke-linecap="round"/><path d="M 42,18 C 47,22 47,31 42,35" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/><path d="M 45,14 C 51,19 51,33 45,38" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round"/></svg><div><h1 class="logo">वॉयस ऑफ क्रांति</h1><p class="tagline">सत्य की आवाज़, जनता का विश्वास</p><p style="font-size:0.68rem;color:#1a1a1a;font-weight:700;margin:2px 0 0;letter-spacing:.3px;background:rgba(255,255,255,0.75);padding:1px 5px;border-radius:3px;">RNI: MPHIN/26/A5773</p></div></a>

                <a href="/" class="nav-link">🏠 Home</a>

    </header>

    <main class="container">
        <div class="login-container">
            <div class="login-box">
                <h2 class="login-title">🔐 Admin Login</h2>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required 
                            placeholder="Enter username"
                            class="form-input"
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="Enter password"
                            class="form-input"
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <span id="submitText">Login</span>
                        <span id="loadingText" style="display: none;">Logging in...</span>
                    </button>
                </form>

                <div id="message" class="message"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 वॉयस ऑफ क्रांति. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const submitText = document.getElementById('submitText');
        const loadingText = document.getElementById('loadingText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            submitText.style.display = 'none';
            loadingText.style.display = 'inline';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1000);
                } else {
                    showMessage(data.error || 'Invalid username or password', 'error');
                }
            } catch (error) {
                showMessage('Login failed. Please try again.', 'error');
            } finally {
                submitText.style.display = 'inline';
                loadingText.style.display = 'none';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message message-${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
