<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">

    <meta http-equiv="refresh" content="1;url=/">
    <title>पेज नहीं मिला — वॉयस ऑफ क्रांति</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 52 52%22><rect width=%2252%22 height=%2252%22 rx=%229%22 fill=%22%23ff9933%22/><rect x=%2219%22 y=%225%22 width=%2214%22 height=%2222%22 rx=%227%22 fill=%22white%22/><path d=%22M 10,22 Q 10,35 26,35 Q 42,35 42,22%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/><line x1=%2226%22 y1=%2235%22 x2=%2226%22 y2=%2243%22 stroke=%22white%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/><line x1=%2217%22 y1=%2243%22 x2=%2235%22 y2=%2243%22 stroke=%22white%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/><path d=%22M 42,18 C 47,22 47,31 42,35%22 fill=%22none%22 stroke=%22white%22 stroke-opacity=%22.8%22 stroke-width=%222%22 stroke-linecap=%22round%22/></svg>">
    <link rel="stylesheet" href="/styles.css?v=21">
    <style>
        .not-found-container {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1.5rem;
        }
        .not-found-code {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary, #ff9933), #e65c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .not-found-heading {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text, #1a1a1a);
            margin-bottom: 1rem;
        }
        .not-found-desc {
            color: var(--muted, #666);
            font-size: 1.05rem;
            max-width: 420px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .not-found-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .not-found-btn {
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity .2s;
        }
        .not-found-btn:hover { opacity: .82; }
        .not-found-btn-primary {
            background: var(--primary, #ff9933);
            color: #fff;
        }
        .not-found-btn-secondary {
            background: var(--surface, #f5f5f5);
            color: var(--text, #1a1a1a);
            border: 1.5px solid var(--border, #ddd);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container" style="display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;">
            <a href="/" class="logo-container" style="text-decoration:none;display:flex;align-items:center;gap:.6rem;">
                <svg width="42" height="42" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                    <rect width="52" height="52" rx="9" fill="#ff9933"/>
                    <rect x="7" y="9" width="38" height="5" rx="2.5" fill="white"/>
                    <rect x="7" y="19" width="16" height="3" rx="1.5" fill="white" opacity=".85"/>
                    <rect x="7" y="25" width="16" height="3" rx="1.5" fill="white" opacity=".85"/>
                    <rect x="7" y="31" width="16" height="3" rx="1.5" fill="white" opacity=".85"/>
                    <rect x="27" y="19" width="18" height="13" rx="3" fill="#fff" opacity=".7"/>
                </svg>
                <span class="logo" style="font-size:1.25rem;font-weight:800;color:#fff;">वॉयस ऑफ क्रांति</span>
            </a>
        </div>
    </header>

    <main>
        <div class="not-found-container">
            <div class="not-found-code">404</div>
            <h1 class="not-found-heading">पेज नहीं मिला</h1>
            <p class="not-found-desc">
                आप जिस पेज की तलाश कर रहे हैं वह अब उपलब्ध नहीं है, हटा दिया गया है, या यहाँ कभी था ही नहीं।
            </p>
            <p style="color:var(--muted,#888);font-size:.9rem;margin-bottom:1.25rem;">आप <strong id="countdown">3</strong> सेकंड में स्वचालित रूप से होम पेज पर भेजे जाएंगे।</p>
            <div class="not-found-links">
                <a href="/" class="not-found-btn not-found-btn-primary">🏠 होम पेज पर जाएं</a>
                <a href="/about.html" class="not-found-btn not-found-btn-secondary">हमारे बारे में</a>
                <a href="/contact.html" class="not-found-btn not-found-btn-secondary">संपर्क करें</a>
            </div>
        </div>
    </main>

    <footer style="text-align:center;padding:1.5rem;color:var(--muted,#666);font-size:.875rem;border-top:1px solid var(--border,#eee);">
        &copy; 2024-2026 वॉयस ऑफ क्रांति — सत्य की आवाज़, जनता का विश्वास
    </footer>
    <script>
        (function () {
            var sec = 3;
            var el = document.getElementById('countdown');
            var timer = setInterval(function () {
                sec--;
                if (el) el.textContent = sec;
                if (sec <= 0) {
                    clearInterval(timer);
                    window.location.replace('/');
                }
            }, 1000);
        })();
    </script>
</body>
</html>
