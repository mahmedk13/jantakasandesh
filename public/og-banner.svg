<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#e8832a"/>
    </linearGradient>
    <linearGradient id="socialBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top saffron accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Decorative glow circles -->
  <circle cx="980" cy="280" r="320" fill="#FF9933" opacity="0.04"/>
  <circle cx="200"  cy="500" r="200" fill="#FF9933" opacity="0.03"/>

  <!-- Left vertical saffron stripe -->
  <rect x="0" y="8" width="6" height="554" fill="#FF9933" opacity="0.6"/>

  <!-- Microphone icon (left column) -->
  <g transform="translate(160, 270)">
    <!-- Capsule body -->
    <rect x="-38" y="-80" width="76" height="125" rx="38" fill="none" stroke="#FF9933" stroke-width="6"/>
    <!-- Pickup arc -->
    <path d="M -68 48 Q -68 118 0 118 Q 68 118 68 48" fill="none" stroke="#FF9933" stroke-width="6" stroke-linecap="round"/>
    <!-- Stand -->
    <line x1="0" y1="118" x2="0" y2="155" stroke="#FF9933" stroke-width="6" stroke-linecap="round"/>
    <line x1="-38" y1="155" x2="38" y2="155" stroke="#FF9933" stroke-width="6" stroke-linecap="round"/>
    <!-- Sound waves -->
    <path d="M 78 8 C 105 30 105 82 78 104" fill="none" stroke="#FF9933" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
    <path d="M 100 -16 C 140 14 140 98 100 128" fill="none" stroke="#FF9933" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Main brand text -->
  <text x="600" y="230" font-family="'Noto Sans Devanagari', Arial, sans-serif" font-size="82" font-weight="800" fill="white" text-anchor="middle">वॉयस ऑफ क्रांति</text>

  <!-- English name -->
  <text x="600" y="306" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#FF9933" text-anchor="middle" letter-spacing="6">VOICE OF KRANTI</text>

  <!-- Tagline -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">ताज़ा खबर • सच्ची पत्रकारिता • हिंदी समाचार</text>

  <!-- Divider line -->
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#334155" stroke-width="1.5"/>

  <!-- Social handles row -->
  <!-- Website icon + text -->
  <circle cx="160" cy="460" r="26" fill="#FF9933" opacity="0.15"/>
  <text x="160" y="468" font-family="Arial, sans-serif" font-size="22" fill="#FF9933" text-anchor="middle">🌐</text>
  <text x="200" y="468" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="start">voiceofkranti.com</text>

  <!-- Facebook -->
  <circle cx="520" cy="460" r="26" fill="#1877f2" opacity="0.20"/>
  <text x="520" y="468" font-family="Arial, sans-serif" font-size="22" fill="#60a5fa" text-anchor="middle">f</text>
  <text x="560" y="468" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="start">fb.com/voiceofkranti</text>

  <!-- X / Twitter -->
  <circle cx="820" cy="460" r="26" fill="#e2e8f0" opacity="0.12"/>
  <text x="820" y="469" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#e2e8f0" text-anchor="middle">𝕏</text>
  <text x="860" y="468" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="start">@voiceofkranti</text>

  <!-- YouTube -->
  <circle cx="164" cy="526" r="26" fill="#ff0000" opacity="0.18"/>
  <text x="164" y="534" font-family="Arial, sans-serif" font-size="20" fill="#f87171" text-anchor="middle">▶</text>
  <text x="204" y="534" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="start">youtube.com/voiceofkranti</text>

  <!-- WhatsApp -->
  <circle cx="614" cy="526" r="26" fill="#25d366" opacity="0.18"/>
  <text x="614" y="534" font-family="Arial, sans-serif" font-size="20" fill="#4ade80" text-anchor="middle">✆</text>
  <text x="654" y="534" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="start">WhatsApp चैनल जॉइन करें</text>

  <!-- Bottom saffron bar -->
  <rect x="0" y="562" width="1200" height="8" fill="url(#accent)"/>

  <!-- Bottom tagline strip -->
  <rect x="0" y="570" width="1200" height="60" fill="#0a0f1e"/>
  <text x="600" y="608" font-family="Arial, sans-serif" font-size="18" fill="#475569" text-anchor="middle" letter-spacing="2">© वॉयस ऑफ क्रांति  •  RNI: MPHIN/26/A5773  •  सत्य की आवाज़</text>
</svg>
