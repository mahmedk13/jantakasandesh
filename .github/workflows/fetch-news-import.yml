name: Fetch RSS + NewsData.io + GNews + Currents News

on:
  schedule:
    # Every 4 hours during the same active window as sync-pbshabd.yml (IST ~05:30-21:30,
    # i.e. UTC hours 0-17); cron is UTC, minute :30 to avoid the top-of-hour GH Actions queue.
    - cron: '30 0-17/4 * * *'
  workflow_dispatch:           # manual trigger

concurrency:
  group: fetch-news-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04   # pinned — ubuntu-latest migrates to Ubuntu 26 starting 2026-10-19
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RSS + NewsData.io + GNews + Currents import
        run: node fetch-news-import.js
        env:
          MONGODB_URI:            ${{ secrets.MONGODB_URI }}
          IMAGEKIT_PUBLIC_KEY:    ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY:   ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT:  ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          NEWSDATA_API_KEY:       ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY:          ${{ secrets.GNEWS_API_KEY }}
          CURRENTS_API_KEY:       ${{ secrets.CURRENTS_API_KEY }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
