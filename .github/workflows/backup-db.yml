name: Daily MongoDB Backup to Google Drive

on:
  schedule:
    # 20:00 UTC = 01:30 IST — quiet hours, after PB SHABD's daily window closes
    - cron: '0 20 * * *'
  workflow_dispatch:           # manual trigger

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned — ubuntu-latest migrates to Ubuntu 26 starting 2026-10-19
    # Generous margin for the weekly full-dump day — Atlas M0's shared-tier query
    # throttling (see repo memory) can make a full 20k+ doc collection scan slow;
    # incremental days finish in well under this.
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz -o mongo-tools.tgz
          tar -xzf mongo-tools.tgz
          sudo cp mongodb-database-tools-*/bin/* /usr/local/bin/
          mongodump --version

      - name: Dump database and upload to Google Drive
        env:
          MONGODB_URI:          ${{ secrets.MONGODB_URI }}
          GDRIVE_CLIENT_ID:     ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
        run: node backup-to-gdrive.js
