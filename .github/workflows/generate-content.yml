name: Generate AI Content (Explainers, Shorts, Ka Mat)

# Schedule removed 2026-11-06 — these now run via Vercel's own native cron
# (vercel.json `crons`), which auto-signs requests with the project's own
# CRON_SECRET so it can't drift out of sync with a GitHub Actions secret.
# Kept as workflow_dispatch only, for manual/on-demand runs or debugging.
on:
  workflow_dispatch:

concurrency:
  group: generate-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04   # pinned — ubuntu-latest migrates to Ubuntu 26 starting 2026-10-19
    timeout-minutes: 10

    steps:
      - name: Generate Explainers
        run: |
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/generate-explainers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $STATUS"; cat /tmp/resp.txt; echo
          if [ "$STATUS" = "200" ]; then echo "✅ Explainers done"; else echo "⚠️ Explainers failed"; fi

      - name: Generate Shorts
        run: |
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/generate-shorts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $STATUS"; cat /tmp/resp.txt; echo
          if [ "$STATUS" = "200" ]; then echo "✅ Shorts done"; else echo "⚠️ Shorts failed"; fi

      - name: Generate Ka Mat (Voice of Kranti opinion)
        run: |
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X GET "${{ vars.SITE_URL }}/api/cron/generate-ka-mat" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $STATUS"; cat /tmp/resp.txt; echo
          if [ "$STATUS" = "200" ]; then echo "✅ Ka Mat done"; else echo "⚠️ Ka Mat failed"; fi
