name: Sync PB SHABD News

on:
  schedule:
    # Every 3 hours, but skip 12am-9am IST (no new PB SHABD stories overnight).
    # Cron is UTC; IST = UTC+5:30, so minute :30 lines up exactly on IST hour marks.
    # UTC 3,6,9,12,15 (+:30) = IST 09:00,12:00,15:00,18:00,21:00; 16-27(=0-2) UTC (IST 00:00-08:30) skipped.
    - cron: '30 3,6,9,12,15 * * *'
  workflow_dispatch:           # manual trigger

concurrency:
  group: sync-pbshabd
  cancel-in-progress: false   # let a running sync finish; skip queued duplicates

jobs:
  sync:
    runs-on: ubuntu-24.04   # pinned — ubuntu-latest migrates to Ubuntu 26 starting 2026-10-19
    timeout-minutes: 25     # bumped from 15 — TARGET_STATES grew from 18 to 36 (full all-India coverage)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run PB SHABD sync
        run: node sync-pbshabd.js --pages 3
        env:
          PBSHABD_EMAIL:          ${{ secrets.PBSHABD_EMAIL }}
          PBSHABD_PASSWORD:       ${{ secrets.PBSHABD_PASSWORD }}
          MONGODB_URI:            ${{ secrets.MONGODB_URI }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
          IMAGEKIT_PUBLIC_KEY:    ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY:   ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT:  ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          SITE_URL:               https://voiceofkranti.com
